<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Berry Club</title>
<meta name="description" content="무중력 공간을 떠다니는 유리 딸기. 딸기를 하나씩 띄우고, 천천히 부딪히는 소리를 들어 보세요.">
<meta name="theme-color" content="#fbf8f7">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta property="og:title" content="Glass Berry Club · 유리딸기 클럽">
<meta property="og:description" content="무중력의 유리 딸기들이 천천히 부딪혀요.">
<meta property="og:image" content="assets/glass-sphere-ruby.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #fbf8f7;
    --ink: #111111;
    --ink-2: #4a4446;
    --ink-3: #8a8284;
    --berry: #e0122d;
    --line: rgba(17, 17, 17, .14);
    --glass: rgba(255, 255, 255, .72);
    --chip-ring: rgba(17, 17, 17, .9);
    --copy-h: 0px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: none; user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #stage.dragging { cursor: grabbing; }

  .ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .brand { position: absolute; top: max(18px, env(safe-area-inset-top)); left: max(20px, env(safe-area-inset-left));
           font-size: 12px; line-height: 1.35; letter-spacing: .02em; }
  .brand b { display: block; font-weight: 800; font-size: 13px; letter-spacing: .14em; }
  .brand span { color: var(--ink-2); }
  .info { position: absolute; top: max(18px, env(safe-area-inset-top)); right: max(20px, env(safe-area-inset-right));
          text-align: right; }
  .info .lead { font-size: clamp(13px, 1.25vw, 17px); font-weight: 500; line-height: 1.35; }
  .info .big { font-size: clamp(40px, 6.2vw, 86px); font-weight: 800; line-height: .92; letter-spacing: -.03em; margin-top: 10px;
               font-variant-numeric: tabular-nums; }
  .info .unit { font-size: clamp(18px, 2.3vw, 32px); font-weight: 700; letter-spacing: -.01em; }

  .copy { position: absolute; left: max(20px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom));
          right: max(20px, env(safe-area-inset-right)); display: flex; align-items: flex-end;
          justify-content: space-between; gap: 24px; }
  .copy h1 { margin: 0 0 8px; font-size: clamp(17px, 1.7vw, 24px); font-weight: 700; letter-spacing: -.02em; }
  .copy p { margin: 0; font-size: clamp(12px, 1.05vw, 14px); line-height: 1.6; color: var(--ink-2); }
  .copy .hint { margin-top: 10px; font-size: 12px; color: var(--ink-3); letter-spacing: .01em; }

  .controls { pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .btn { appearance: none; border: 1px solid var(--line); background: var(--glass);
         -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
         color: var(--ink); font: 600 13px/1 "Pretendard", system-ui, sans-serif; height: 36px; padding: 0 14px;
         border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
         transition: transform .15s, background .2s, color .2s; }
  .btn:active { transform: scale(.95); }
  .btn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .chips { display: flex; gap: 7px; }
  .chip { width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
          background-image: url(assets/color-chips.jpg); background-size: 300% 200%;
          box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08), 0 2px 6px rgba(160, 0, 30, .18);
          outline: 2px solid transparent; outline-offset: 2px; transition: transform .15s, outline-color .2s; }
  .chip:active { transform: scale(.9); }
  .chip.on { outline-color: var(--chip-ring); }
  .chip.mix { background: conic-gradient(#e0122d, #ff6b93, #ffd3de, #7d1552, #ff4a1c, #8f0f33, #e0122d); }

  /* 가운데 딸기 추가 */
  .add-wrap { position: absolute; left: 50%; transform: translateX(-50%);
              bottom: max(22px, env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: center; pointer-events: auto; }
  .add { height: 52px; padding: 0 22px 0 8px; gap: 10px; font-size: 15px; font-weight: 700;
         background: var(--ink); color: #fff; border-color: var(--ink);
         box-shadow: 0 10px 28px rgba(200, 0, 40, .22); }
  .add .dot { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
              background: radial-gradient(circle at 35% 30%, #ff9aa8 0%, #ff2b3f 38%, #a8001a 100%); }
  .add .dot svg { width: 18px; height: 18px; }
  .add:disabled { opacity: .45; cursor: default; }
  .reset { width: 40px; height: 40px; padding: 0; justify-content: center; }

  /* 배경 문구 편집 */
  .panel { position: fixed; z-index: 5; right: max(20px, env(safe-area-inset-right)); bottom: 150px; width: 320px;
           background: rgba(255, 255, 255, .9); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
           border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: 0 18px 50px rgba(60, 0, 15, .16);
           display: flex; flex-direction: column; gap: 14px; user-select: text; -webkit-user-select: text; touch-action: auto; }
  .panel[hidden] { display: none; }
  .panel h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .field small { font-weight: 400; color: var(--ink-3); }
  .field textarea, .field input[type=text] {
    font: 700 16px/1.35 "Pretendard", system-ui, sans-serif; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: none; outline: none; }
  .field textarea:focus, .field input[type=text]:focus { border-color: var(--ink); }
  .toggle { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; cursor: pointer; }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle .sw { width: 44px; height: 26px; border-radius: 999px; background: #ddd5d6; position: relative; transition: background .2s; flex: none; }
  .toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
                       background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .2s; }
  .toggle input:checked + .sw { background: var(--berry); }
  .toggle input:checked + .sw::after { transform: translateX(18px); }
  .toggle input:focus-visible + .sw { outline: 2px solid var(--ink); outline-offset: 2px; }
  .panel-row { display: flex; gap: 8px; justify-content: flex-end; }
  .panel .btn.done { background: var(--ink); color: #fff; border-color: var(--ink); }

  .toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6;
           background: rgba(17, 17, 17, .86); color: #fff; padding: 12px 18px; border-radius: 14px;
           font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .3s; text-align: center; }
  .toast.show { opacity: 1; }

  .loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 7; background: var(--bg);
             transition: opacity .6s; font-size: 13px; letter-spacing: .14em; font-weight: 700; }
  .loading.done { opacity: 0; pointer-events: none; }

  @media (max-width: 760px) {
    .copy { flex-direction: column; align-items: stretch; gap: 14px; }
    .controls { align-items: stretch; }
    .row { justify-content: space-between; }
    .row .btn { flex: 1; justify-content: center; padding: 0 8px; }
    .chips { justify-content: space-between; flex: 1; }
    .chip { width: 32px; height: 32px; }
    .info .big { margin-top: 6px; }
    .copy p br { display: none; }
    .add-wrap { bottom: calc(var(--copy-h) + 30px); }
    .add { height: 48px; font-size: 14px; }
    .add .dot { width: 34px; height: 34px; }
    .panel { left: 12px; right: 12px; width: auto; bottom: max(12px, env(safe-area-inset-bottom)); }
  }
  @media (max-width: 380px) {
    .chip { width: 28px; height: 28px; }
    .btn { font-size: 12px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }

</head>
<body>
<canvas id="stage" aria-label="떠다니는 유리 딸기"></canvas>

<div class="ui">
  <div class="brand"><b>GLASS BERRY CLUB</b><span>유리딸기 클럽 · 2026</span></div>

  <div class="info">
    <div class="lead">무중력에 띄운 유리 딸기<br>천천히 부딪혀 봐요</div>
    <div class="big"><span id="count">01</span><span class="unit"> 알</span></div>
  </div>

  <div class="add-wrap" id="addWrap">
    <button class="btn add" id="btnAdd" type="button">
      <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      딸기 띄우기
    </button>
    <button class="btn reset" id="btnReset" type="button" aria-label="하나만 남기기" title="하나만 남기기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>

  <div class="copy" id="copy">
    <div>
      <h1>무중력의 딸기들이, 천천히 부딪혀요.</h1>
      <p>딸기를 하나씩 띄워 보세요. 살짝 밀면 우주를 떠다니듯 미끄러지고,<br>
         서로 닿을 때마다 맑은 유리 소리가 길게 울립니다. 딸기를 누르면 색이 바뀌어요.</p>
      <div class="hint" id="hint">끌어서 살짝 밀기 · 스페이스바로 흔들기</div>
    </div>
    <div class="controls">
      <div class="row">
        <button class="btn on" id="btnSound" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          <span>소리</span>
        </button>
        <button class="btn" id="btnText" type="button" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="M9 19h6"/></svg>
          <span>문구</span>
        </button>
        <button class="btn" id="btnGravity" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v13"/><path d="m6 11 6 6 6-6"/><path d="M5 21h14"/></svg>
          <span>중력</span>
        </button>
        <button class="btn" id="btnShake" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 9v6M21 9v6"/></svg>
          <span id="shakeLabel">흔들기</span>
        </button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="딸기 색">
        <button class="chip mix on" data-color="-1" type="button" aria-label="섞기"></button>
        <button class="chip" data-color="0" type="button" aria-label="레드" style="background-position:0% 0%"></button>
        <button class="chip" data-color="1" type="button" aria-label="핑크" style="background-position:50% 0%"></button>
        <button class="chip" data-color="2" type="button" aria-label="클리어핑크" style="background-position:100% 0%"></button>
        <button class="chip" data-color="3" type="button" aria-label="퍼플" style="background-position:0% 100%"></button>
        <button class="chip" data-color="4" type="button" aria-label="오렌지레드" style="background-position:50% 100%"></button>
        <button class="chip" data-color="5" type="button" aria-label="레드퍼플" style="background-position:100% 100%"></button>
      </div>
    </div>
  </div>
</div>

<div class="panel" id="panel" hidden role="dialog" aria-label="배경 문구 편집">
  <h2>배경 문구</h2>
  <label class="field">큰 문구 <small>줄바꿈하면 그대로 줄이 나뉘어요</small>
    <textarea id="inMain" rows="3" maxlength="48" spellcheck="false"></textarea>
  </label>
  <label class="field">작은 문구
    <input type="text" id="inSub" maxlength="24" spellcheck="false">
  </label>
  <label class="toggle">시간·날짜 표시
    <input type="checkbox" id="inClock"><span class="sw"></span>
  </label>
  <div class="panel-row">
    <button class="btn" id="btnTextReset" type="button">처음 문구로</button>
    <button class="btn done" id="btnTextDone" type="button">완료</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading" id="loading">GLASS BERRY</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const MAX_BERRIES = 18;

/* ---------- 색 (레퍼런스 컬러 변형 6종) ---------- */
const PALETTE = [
  { name: '레드',       color: '#ff2b3f', att: '#c4001c', dist: 0.55 },
  { name: '핑크',       color: '#ff7aa0', att: '#ff2d6a', dist: 0.9 },
  { name: '클리어핑크', color: '#ffe3ea', att: '#ffb3c6', dist: 2.6 },
  { name: '퍼플',       color: '#c0367a', att: '#5a0838', dist: 0.45 },
  { name: '오렌지레드', color: '#ff5a2a', att: '#e41d08', dist: 0.7 },
  { name: '레드퍼플',   color: '#e02150', att: '#6e0626', dist: 0.42 },
];
// 알마다 다른 음 — 중음역 펜타토닉이라 여러 개가 닿아도 화음처럼 겹침
const NOTES = [523.3, 587.3, 659.3, 784.0, 880.0, 1046.5, 1174.7, 1318.5];
const HERO_NOTE = 392.0;

/* ---------- 렌더러 ---------- */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? 1.6 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.setClearColor(0xfbf8f7, 1);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environmentIntensity = 1.1;

const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-3, 5, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xffd6de, 1.4); rim.position.set(4, -2, 3); scene.add(rim);

const CAM_Z = 12, FOV = 30, TEXT_Z = -3.2;
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);
camera.position.set(0, 0, CAM_Z);

let W = 1, H = 1, HW = 1, HH = 1, UNIT = 1;   // HW/HH = z=0 평면의 보이는 반폭/반높이
let FLOOR = -1;                                // 아래쪽 경계 (문구 블록·추가 버튼 위)
let BASE_R = 1;

/* ---------- 배경 문구 설정 ---------- */
const DEFAULT_TEXT = { main: 'GLASS BERRY', sub: '유리 딸기', clock: false };
const TEXT_KEY = 'glassberry.text';
let typeOpt = { ...DEFAULT_TEXT };
try { const s = JSON.parse(localStorage.getItem(TEXT_KEY)); if (s && typeof s.main === 'string') typeOpt = { ...DEFAULT_TEXT, ...s }; } catch (e) {}
function saveText() { try { localStorage.setItem(TEXT_KEY, JSON.stringify(typeOpt)); } catch (e) {} }

/* ---------- 뒤쪽 타이포그래피 (유리가 굴절시키도록 3D 평면에 그림) ---------- */
const textCanvas = document.createElement('canvas');
const tctx = textCanvas.getContext('2d');
const textTex = new THREE.CanvasTexture(textCanvas);
textTex.colorSpace = THREE.SRGBColorSpace;
textTex.anisotropy = 4;
const textPlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: textTex, toneMapped: false }));
textPlane.position.z = TEXT_Z;
scene.add(textPlane);

const DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const pad2 = n => String(n).padStart(2, '0');
function splitLines(text, portrait) {
  const raw = text.split('\n').map(s => s.trim()).filter(Boolean);
  if (!raw.length) return [];
  let lines = raw.length > 1 ? raw : raw[0].split(/\s+/);
  // 세로 화면에선 긴 단어를 포스터처럼 반으로 쪼갬 (GLASS → GLA / SS)
  if (portrait && raw.length === 1) {
    lines = lines.flatMap(w => [...w].length >= 5 ? [[...w].slice(0, Math.ceil([...w].length / 2)).join(''), [...w].slice(Math.ceil([...w].length / 2)).join('')] : [w]);
  }
  return lines.slice(0, 6);
}
function drawType() {
  const dpr = Math.min(devicePixelRatio, 2);
  const cw = Math.round(Math.min(W * dpr, 2600)), ch = Math.round(cw * H / W);
  textCanvas.width = cw; textCanvas.height = ch;
  const c = tctx;
  c.fillStyle = '#fbf8f7'; c.fillRect(0, 0, cw, ch);
  c.fillStyle = '#111111';
  c.textBaseline = 'alphabetic';
  const portrait = H > W * 1.05;
  const pad = cw * (portrait ? 0.035 : 0.03);
  const top = ch * (portrait ? 0.14 : 0.13);
  const bottom = ch * (portrait ? 0.66 : 0.76);
  const clockH = typeOpt.clock ? (bottom - top) * (portrait ? 0.24 : 0.28) : 0;
  const mainBottom = bottom - clockH;
  const lines = splitLines(typeOpt.main, portrait);
  const font = (w, s) => `${w} ${s}px Pretendard, system-ui, sans-serif`;
  const ls = s => { if ('letterSpacing' in c) c.letterSpacing = `${s}px`; };

  let last = null, size = 0;
  if (lines.length) {
    const lineH = (mainBottom - top) / lines.length;
    size = lineH * 1.18;
    c.font = font(900, size); ls(-size * 0.045);
    const maxW = cw * (portrait ? 0.93 : 0.72) - pad;
    const widest = Math.max(...lines.map(l => c.measureText(l).width));
    if (widest > maxW) size *= maxW / widest;
    c.font = font(900, size); ls(-size * 0.045);
    lines.forEach((l, i) => {
      const w = c.measureText(l).width;
      const y = top + lineH * (i + 1) - lineH * 0.08;
      // 포스터처럼 좌·우로 번갈아 배치
      const x = portrait ? (i % 2 ? cw - pad - w : pad) : (i % 2 ? pad + cw * 0.12 : pad);
      c.fillText(l, x, y);
      last = { x, w, y };
    });
  }
  // 마지막 줄 끝에 붙는 작은 문구
  if (typeOpt.sub.trim()) {
    const s = Math.round((size || ch * 0.2) * 0.17);
    c.font = font(700, s); ls(0);
    const kw = c.measureText(typeOpt.sub).width;
    if (last) c.fillText(typeOpt.sub, last.x + last.w - kw, last.y + size * 0.24);
    else c.fillText(typeOpt.sub, cw - pad - kw, top + s);
  }
  // 시간·날짜
  if (typeOpt.clock) {
    const d = new Date();
    const time = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    const date = `${d.getFullYear()}.${pad2(d.getMonth() + 1)}.${pad2(d.getDate())} ${DAYS[d.getDay()]}`;
    let ts = clockH * 1.05;
    c.font = font(200, ts); ls(-ts * 0.03);
    const maxW = cw * (portrait ? 0.9 : 0.5);
    const tw0 = c.measureText(time).width;
    if (tw0 > maxW) { ts *= maxW / tw0; c.font = font(200, ts); }
    const tw = c.measureText(time).width;
    const ty = bottom + (last ? 0 : -clockH * 0.1);

  if (m > 9 && now - lastShake > 180) {
    lastShake = now;
    shake(Math.min(1.4, (m - 6) / 14), new THREE.Vector2(-a.x, -a.y).normalize());
  }
}
if (IS_TOUCH) $('hint').textContent = '끌어서 살짝 밀기 · ‘흔들기’를 누르면 폰 센서가 켜져요';

/* ---------- 물리 : 무중력 ---------- */
const tmp = new THREE.Vector2(), n2 = new THREE.Vector2();
const qd = new THREE.Quaternion(), axis = new THREE.Vector3();
let clock = 0;

function hit(b, strength, pan) {
  if (clock - b.lastHit < 0.25) return;
  b.lastHit = clock;
  Sound.ting(strength, b.note, pan);
}

function step(dt) {
  clock += dt;
  const G = UNIT * 1.1;
  // 사라지는 딸기는 작아지며 빠짐
  for (let i = bodies.length - 1; i >= 0; i--) {
    const b = bodies[i];
    if (b.leaving) { b.grow -= dt * 2.4; if (b.grow <= 0) removeBody(b); }
    else if (b.grow < 1) b.grow = Math.min(1, b.grow + dt * 1.6);
  }
  for (const b of bodies) {
    if (pointer.body === b) {
      tmp.copy(pointer.world).add(pointer.offset).sub(b.pos);
      b.vel.lerp(tmp.multiplyScalar(6), 0.25);   // 손끝을 느슨하게 따라옴
      continue;
    }
    if (state.gravity) {
      b.vel.x += state.gx * G * dt; b.vel.y += state.gy * G * dt;
      b.vel.multiplyScalar(Math.pow(0.6, dt));
    } else {
      // 무중력: 마찰이 거의 없고, 아주 천천히 원래의 느린 표류로 돌아감
      tmp.copy(b.drift).multiplyScalar(UNIT);
      b.vel.lerp(tmp, 1 - Math.exp(-dt / 7));
    }
    b.vel.clampLength(0, UNIT * 2);
  }
  for (const b of bodies) b.pos.addScaledVector(b.vel, dt);

  // 서로 부딪힘 — 무거운 유리구슬처럼 둔하게
  for (let i = 0; i < bodies.length; i++) for (let j = i + 1; j < bodies.length; j++) {
    const a = bodies[i], c = bodies[j];
    const ra = a.r * a.grow, rc = c.r * c.grow;
    n2.copy(c.pos).sub(a.pos);
    const d = n2.length(), min = (ra + rc) * 0.9;
    if (d >= min || d === 0) continue;
    n2.divideScalar(d);
    const ma = a.r ** 3 * (a.isHero ? 1.6 : 1), mc = c.r ** 3 * (c.isHero ? 1.6 : 1);
    const ia = pointer.body === a ? 0 : 1 / ma, ic = pointer.body === c ? 0 : 1 / mc;
    const sum = ia + ic || 1, pen = min - d;
    a.pos.addScaledVector(n2, -pen * ia / sum); c.pos.addScaledVector(n2, pen * ic / sum);
    const vn = tmp.copy(c.vel).sub(a.vel).dot(n2);
    if (vn < 0) {
      const jimp = -(1 + 0.8) * vn / sum;
      a.vel.addScaledVector(n2, -jimp * ia); c.vel.addScaledVector(n2, jimp * ic);
      // 부딪힌 만큼만 아주 조금 돌아감
      const tw = Math.min(0.35, -vn / UNIT * 0.25);
      a.ang.add(randomUnit3(tw)); c.ang.add(randomUnit3(tw));
      const s = Math.min(1, -vn / (UNIT * 0.9));
      if (s > 0.04) {
        const pan = ((a.pos.x + c.pos.x) / 2) / HW;
        hit(a, s, pan); if (s > 0.25) hit(c, s * 0.7, pan);
        a.pop = Math.max(a.pop, s * 0.4); c.pop = Math.max(c.pop, s * 0.4);
      }
    }
  }
  // 화면 가장자리 — 부드럽게 되튕김
  for (const b of bodies) {
    const lim = 0.82 * b.grow;
    const ex = HW - b.r * lim, ey = HH - b.r * lim;
    const fy = state.gravity && state.gy > 0.2 ? -ey : Math.max(-ey, FLOOR + b.r * lim);
    const e = state.gravity ? 0.35 : 0.8;
    let v = 0;
    if (b.pos.x < -ex) { b.pos.x = -ex; if (b.vel.x < 0) { v = -b.vel.x; b.vel.x *= -e; b.drift.x = Math.abs(b.drift.x); } }
    if (b.pos.x > ex) { b.pos.x = ex; if (b.vel.x > 0) { v = b.vel.x; b.vel.x *= -e; b.drift.x = -Math.abs(b.drift.x); } }
    if (b.pos.y < fy) { b.pos.y = fy; if (b.vel.y < 0) { v = Math.max(v, -b.vel.y); b.vel.y *= -e; b.drift.y = Math.abs(b.drift.y); } }
    if (b.pos.y > ey) { b.pos.y = ey; if (b.vel.y > 0) { v = Math.max(v, b.vel.y); b.vel.y *= -e; b.drift.y = -Math.abs(b.drift.y); } }
    const s = v / (UNIT * 1.6);
    if (s > 0.08) hit(b, s * 0.45, b.pos.x / HW);
  }

  // 회전 — 각자의 아주 느린 자전으로 서서히 돌아감
  for (const b of bodies) {
    if (state.gravity) b.ang.multiplyScalar(Math.pow(0.4, dt));
    else b.ang.lerp(b.spin, 1 - Math.exp(-dt / 3));
    b.ang.clampLength(0, 0.9);
    const w = b.ang.length();
    if (w > 1e-4) {
      axis.copy(b.ang).divideScalar(w);
      qd.setFromAxisAngle(axis, w * dt);
      b.mesh.quaternion.premultiply(qd);
    }
    b.pop = Math.max(0, b.pop - dt * 1.8);
  }
}

function syncMeshes() {
  const k = (CAM_Z - TEXT_Z) / CAM_Z;
  for (const b of bodies) {
    b.mesh.position.set(b.pos.x, b.pos.y, b.z);
    const g = b.grow < 1 ? 1 - Math.pow(1 - Math.max(0, b.grow), 3) : 1;
    const pulse = 1 + Math.sin(b.pop * Math.PI) * 0.04;
    b.mesh.scale.setScalar(b.r / b.unitR * pulse * g);
    // 뒤 종이에 번지는 붉은 그림자 — 빛이 왼쪽 위에서 옴
    b.shadow.position.set(b.pos.x * k + b.r * 0.55, b.pos.y * k - b.r * 0.75, TEXT_Z + 0.01);
    b.shadow.scale.set(b.r * 2.9 * k * g, b.r * 2.2 * k * g, 1);
    b.shadow.rotation.z = -0.5;
  }
}

/* ---------- 생성 ---------- */
function decodeB64(s) { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
async function loadHeroBuffer() {
  if (location.protocol !== 'file:') {
    try { const r = await fetch('assets/berry-hero.glb'); if (r.ok) return await r.arrayBuffer(); } catch (e) {}
  }
  // 파일을 더블클릭해서 열었을 때 (file://) 대비
  await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'assets/berry-hero.glb.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  return decodeB64(window.BERRY_HERO_B64);
}

async function build() {
  try { await Promise.all(['900 100px Pretendard', '700 20px Pretendard', '200 100px Pretendard', '600 20px Pretendard'].map(f => document.fonts.load(f))); } catch (e) {}
  layout();

  // 처음엔 사용자 3D 모델 딸기 한 알만
  let heroGeo = null;
  try {
    const buf = await loadHeroBuffer();
    const gltf = await new Promise((ok, no) => new GLTFLoader().parse(buf, '', ok, no));
    gltf.scene.traverse(o => { if (o.isMesh && !heroGeo) heroGeo = o.geometry; });
  } catch (e) { console.warn('hero model failed, using procedural berry', e); }
  const m = new THREE.Mesh(heroGeo || geos[0], glassMaterial(0));
  m.rotation.set(0.15, -0.35, -0.08);
  const hero = addBody(m, { k: 1.45, pi: 0, note: HERO_NOTE, unitR: heroGeo ? 0.95 : 1.05, isHero: true });
  hero.pos.set(0, (FLOOR + HH) / 2);
  hero.grow = 0;
  $('loading').classList.add('done');

  let prev = performance.now();
  renderer.setAnimationLoop(now => {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    for (let i = 0; i < 3; i++) step(dt / 3);
    bodies.forEach(b => tickMaterial(b.mesh.material, dt));
    syncMeshes();
    renderer.render(scene, camera);
  });
}

let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 120); });
build();
</script>
</body>
